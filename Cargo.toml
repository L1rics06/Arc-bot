[package]
name = "arc-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
addissue = { version = "0.1.0", path = "plugins/addissue" }
echo = { version = "0.1.0", path = "plugins/echo" }

kovi.workspace = true
kovi-onebot.workspace = true
kovi-plugin-cmd = { version = "0.4.0", features = ["onebot"] }

[workspace]
members = ["plugins/addissue","plugins/echo"]

[workspace.dependencies]
kovi = "0.13.5"
kovi-onebot = "0.13.2"